apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prontclinic-painel
  namespace: argocd
  labels:
    app: prontclinic-painel
    project: ProntClinic
    environment: development
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.discord: ""
    notifications.argoproj.io/subscribe.on-sync-failed.discord: ""
    notifications.argoproj.io/subscribe.on-sync-running.discord: ""
    notifications.argoproj.io/subscribe.on-health-degraded.discord: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ptcc-development
  
  # Repositório Git
  source:
    repoURL: https://github.com/Prontdental-br/Infra-Clinic.git
    targetRevision: ptcc-production
    path: k8s-manifests/development/prontclinic-painel
    
  # Destino (onde será aplicado)
  destination:
    server: https://kubernetes.default.svc
    namespace: ptcc-development
  
  # Sincronização automática
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  
  # Configurações de revisão
  revisionHistoryLimit: 10
  
  # Ignorar diferenças (se necessário)
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

