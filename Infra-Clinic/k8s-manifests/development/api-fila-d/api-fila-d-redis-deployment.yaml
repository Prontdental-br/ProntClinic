apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-fila-d-redis
  namespace: ptcc-development
  labels:
    app: api-fila-d-redis
    project: "ProntClinic"
    environment: "development"
    component: "redis"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-fila-d-redis
  template:
    metadata:
      labels:
        app: api-fila-d-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: REDIS_PASSWORD
          value: "redis123"
        command:
        - redis-server
        - --requirepass
        - redis123
        - --appendonly
        - "yes"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - redis123
            - ping
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - redis123
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        emptyDir: {}
