apiVersion: apps/v1
kind: Deployment
metadata:
  name: prontclinic-api-redis
  namespace: ptcc-development
  labels:
    app: prontclinic-api-redis
    component: redis
    project: "ProntClinic"
    environment: "development"
spec:
  replicas: 1
  strategy:
    type: Recreate  # Redis usa Recreate devido ao PVC ReadWriteOnce
  selector:
    matchLabels:
      app: prontclinic-api-redis
  template:
    metadata:
      labels:
        app: prontclinic-api-redis
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - --requirepass
        - redis123
        - --appendonly
        - "yes"
        - --save
        - "900 1"
        - --save
        - "300 10"
        - --save
        - "60 10000"
        env:
        - name: REDIS_PASSWORD
          value: "redis123"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - redis123
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - -a
            - redis123
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: prontclinic-api-redis-pvc

