apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-chat-d
  namespace: ptcc-development
  labels:
    app: api-chat-d
    project: "ProntClinic"
    environment: "development"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-chat-d
  template:
    metadata:
      labels:
        app: api-chat-d
    spec:
      initContainers:
      - name: redis-dependency-check
        image: redis:7-alpine
        command: ['sh', '-c']
        args:
        - |
          until redis-cli -h api-chat-d-redis-service.ptcc-development.svc.cluster.local -a redis123 ping; do
            echo "Waiting for Redis to be ready..."
            sleep 2
          done
          echo "Redis is ready!"
      containers:
      - name: evolution-api
        image: atendai/evolution-api:v2.2.0
        ports:
        - containerPort: 8080
          name: http
        env:
        # Server Configuration
        - name: SERVER_URL
          value: "https://api-chat-d.prontclinic.com.br"
        - name: AUTHENTICATION_API_KEY
          value: "SviuLdm9HpC7utJjTgIjLDEdVrJHgrt95Z7vH8Vd8y6pzGEmmXP4FaqR63j3Fq87"
        - name: AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES
          value: "true"
        - name: LANGUAGE
          value: "en"
        - name: DEL_INSTANCE
          value: "false"
        
        # Database Configuration
        - name: DATABASE_PROVIDER
          value: "postgresql"
        - name: DATABASE_CONNECTION_URI
          value: "postgresql://prontclinic:prontclinic123@postgresql-dev-rw.ptcc-development.svc.cluster.local:5432/evolution"
        - name: DATABASE_SAVE_DATA_INSTANCE
          value: "true"
        - name: DATABASE_SAVE_DATA_NEW_MESSAGE
          value: "true"
        - name: DATABASE_SAVE_MESSAGE_UPDATE
          value: "true"
        - name: DATABASE_SAVE_DATA_CONTACTS
          value: "true"
        - name: DATABASE_SAVE_DATA_CHATS
          value: "true"
        - name: DATABASE_SAVE_DATA_LABELS
          value: "true"
        - name: DATABASE_SAVE_DATA_HISTORIC
          value: "true"
        - name: DATABASE_CONNECTION_CLIENT_NAME
          value: "evolution"
        
        # RabbitMQ Configuration (Disabled)
        - name: RABBITMQ_ENABLED
          value: "false"
        - name: RABBITMQ_URI
          value: "amqp://admin:admin@rabbitmq:5672/default"
        - name: RABBITMQ_EXCHANGE_NAME
          value: "evolution"
        - name: RABBITMQ_GLOBAL_ENABLED
          value: "false"
        - name: RABBITMQ_EVENTS_APPLICATION_STARTUP
          value: "false"
        - name: RABBITMQ_EVENTS_INSTANCE_CREATE
          value: "false"
        - name: RABBITMQ_EVENTS_INSTANCE_DELETE
          value: "false"
        - name: RABBITMQ_EVENTS_QRCODE_UPDATED
          value: "false"
        - name: RABBITMQ_EVENTS_MESSAGES_SET
          value: "false"
        - name: RABBITMQ_EVENTS_MESSAGES_UPSERT
          value: "true"
        - name: RABBITMQ_EVENTS_MESSAGES_EDITED
          value: "false"
        - name: RABBITMQ_EVENTS_MESSAGES_UPDATE
          value: "false"
        - name: RABBITMQ_EVENTS_MESSAGES_DELETE
          value: "false"
        - name: RABBITMQ_EVENTS_SEND_MESSAGE
          value: "false"
        - name: RABBITMQ_EVENTS_CONTACTS_SET
          value: "false"
        - name: RABBITMQ_EVENTS_CONTACTS_UPSERT
          value: "false"
        - name: RABBITMQ_EVENTS_CONTACTS_UPDATE
          value: "false"
        - name: RABBITMQ_EVENTS_PRESENCE_UPDATE
          value: "false"
        - name: RABBITMQ_EVENTS_CHATS_SET
          value: "false"
        - name: RABBITMQ_EVENTS_CHATS_UPSERT
          value: "false"
        - name: RABBITMQ_EVENTS_CHATS_UPDATE
          value: "false"
        - name: RABBITMQ_EVENTS_CHATS_DELETE
          value: "false"
        - name: RABBITMQ_EVENTS_GROUPS_UPSERT
          value: "false"
        - name: RABBITMQ_EVENTS_GROUP_UPDATE
          value: "false"
        - name: RABBITMQ_EVENTS_GROUP_PARTICIPANTS_UPDATE
          value: "false"
        - name: RABBITMQ_EVENTS_CONNECTION_UPDATE
          value: "true"
        - name: RABBITMQ_EVENTS_CALL
          value: "false"
        - name: RABBITMQ_EVENTS_TYPEBOT_START
          value: "false"
        - name: RABBITMQ_EVENTS_TYPEBOT_CHANGE_STATUS
          value: "false"
        
        # SQS Configuration (Disabled)
        - name: SQS_ENABLED
          value: "false"
        - name: SQS_ACCESS_KEY_ID
          value: ""
        - name: SQS_SECRET_ACCESS_KEY
          value: ""
        - name: SQS_ACCOUNT_ID
          value: ""
        - name: SQS_REGION
          value: ""
        
        # WebSocket Configuration
        - name: WEBSOCKET_ENABLED
          value: "false"
        - name: WEBSOCKET_GLOBAL_EVENTS
          value: "false"
        
        # WhatsApp Business Configuration
        - name: WA_BUSINESS_TOKEN_WEBHOOK
          value: "evolution"
        - name: WA_BUSINESS_URL
          value: "https://graph.facebook.com"
        - name: WA_BUSINESS_VERSION
          value: "v20.0"
        - name: WA_BUSINESS_LANGUAGE
          value: "pt_BR"
        
        # Webhook Configuration
        - name: WEBHOOK_GLOBAL_URL
          value: ""
        - name: WEBHOOK_GLOBAL_ENABLED
          value: "false"
        - name: WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS
          value: "false"
        - name: WEBHOOK_EVENTS_APPLICATION_STARTUP
          value: "false"
        - name: WEBHOOK_EVENTS_QRCODE_UPDATED
          value: "true"
        - name: WEBHOOK_EVENTS_MESSAGES_SET
          value: "true"
        - name: WEBHOOK_EVENTS_MESSAGES_UPSERT
          value: "true"
        - name: WEBHOOK_EVENTS_MESSAGES_EDITED
          value: "true"
        - name: WEBHOOK_EVENTS_MESSAGES_UPDATE
          value: "true"
        - name: WEBHOOK_EVENTS_MESSAGES_DELETE
          value: "true"
        - name: WEBHOOK_EVENTS_SEND_MESSAGE
          value: "true"
        - name: WEBHOOK_EVENTS_CONTACTS_SET
          value: "true"
        - name: WEBHOOK_EVENTS_CONTACTS_UPSERT
          value: "true"
        - name: WEBHOOK_EVENTS_CONTACTS_UPDATE
          value: "true"
        - name: WEBHOOK_EVENTS_PRESENCE_UPDATE
          value: "true"
        - name: WEBHOOK_EVENTS_CHATS_SET
          value: "true"
        - name: WEBHOOK_EVENTS_CHATS_UPSERT
          value: "true"
        - name: WEBHOOK_EVENTS_CHATS_UPDATE
          value: "true"
        - name: WEBHOOK_EVENTS_CHATS_DELETE
          value: "true"
        - name: WEBHOOK_EVENTS_GROUPS_UPSERT
          value: "true"
        - name: WEBHOOK_EVENTS_GROUPS_UPDATE
          value: "true"
        - name: WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE
          value: "true"
        - name: WEBHOOK_EVENTS_CONNECTION_UPDATE
          value: "true"
        - name: WEBHOOK_EVENTS_LABELS_EDIT
          value: "true"
        - name: WEBHOOK_EVENTS_LABELS_ASSOCIATION
          value: "true"
        - name: WEBHOOK_EVENTS_CALL
          value: "true"
        - name: WEBHOOK_EVENTS_TYPEBOT_START
          value: "false"
        - name: WEBHOOK_EVENTS_TYPEBOT_CHANGE_STATUS
          value: "false"
        - name: WEBHOOK_EVENTS_ERRORS
          value: "false"
        - name: WEBHOOK_EVENTS_ERRORS_WEBHOOK
          value: ""
        
        # Session Configuration
        - name: CONFIG_SESSION_PHONE_CLIENT
          value: "APP-PRONTCLINIC-DEV"
        - name: CONFIG_SESSION_PHONE_NAME
          value: "Chrome"
        - name: CONFIG_SESSION_PHONE_VERSION
          value: "2.3000.1026080446"
        - name: QRCODE_LIMIT
          value: "30"
        
        # AI Configuration
        - name: OPENAI_ENABLED
          value: "true"
        - name: DIFY_ENABLED
          value: "true"
        - name: TYPEBOT_ENABLED
          value: "true"
        - name: TYPEBOT_API_VERSION
          value: "latest"
        
        # Chatwoot Configuration (Disabled)
        - name: CHATWOOT_ENABLED
          value: "false"
        - name: CHATWOOT_MESSAGE_READ
          value: "true"
        - name: CHATWOOT_MESSAGE_DELETE
          value: "true"
        - name: CHATWOOT_IMPORT_DATABASE_CONNECTION_URI
          value: "postgresql://evolution:evolution@postgresql-dev-rw.ptcc-development.svc.cluster.local:5432/chatwoot?sslmode=disable"
        - name: CHATWOOT_IMPORT_PLACEHOLDER_MEDIA_MESSAGE
          value: "true"
        
        # Redis Configuration
        - name: CACHE_REDIS_ENABLED
          value: "true"
        - name: CACHE_REDIS_URI
          value: "redis://:redis123@api-chat-d-redis-service.ptcc-development.svc.cluster.local:6379/1"
        - name: CACHE_REDIS_PREFIX_KEY
          value: "evolution-chat"
        - name: CACHE_REDIS_SAVE_INSTANCES
          value: "true"
        - name: CACHE_LOCAL_ENABLED
          value: "false"
        
        # MinIO Configuration (Disabled for now)
        - name: S3_ENABLED
          value: "false"
        - name: S3_ACCESS_KEY
          value: "suachave"
        - name: S3_SECRET_KEY
          value: "suachave"
        - name: S3_BUCKET
          value: "evolutionv3"
        - name: S3_PORT
          value: "443"
        - name: S3_ENDPOINT
          value: "minioserver.meubot.top"
        - name: S3_USE_SSL
          value: "true"
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /manager/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /manager/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
