apiVersion: v1
kind: Service
metadata:
  name: api-chat-d-combined-service
  namespace: ptcc-development
  labels:
    app: api-chat-d-combined
    project: "ProntClinic"
    environment: "development"
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: api-chat-d-combined
