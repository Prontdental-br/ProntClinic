apiVersion: apps/v1
kind: Deployment
metadata:
  name: prontclinic-app
  namespace: ptcc-production
  labels:
    app: prontclinic-app
    project: "ProntClinic"
    environment: "production"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prontclinic-app
  template:
    metadata:
      labels:
        app: prontclinic-app
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: prontclinic-app
        image: prontdentalsoftware/prontclinic-app:ptcc-production-latest
        ports:
        - containerPort: 3000
          name: http
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Volume mounts for persistent data if needed
        volumeMounts:
        - name: app-logs
          mountPath: /app/logs
      
      volumes:
      - name: app-logs
        emptyDir: {}
