name: Update Kubernetes Manifest - API

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag da imagem (ex: ptcc-development-20251030221633)'
        required: true
      docker_image:
        description: 'Nome completo da imagem Docker'
        required: false
        default: 'prontdentalsoftware/prontclinic-api'
  repository_dispatch:
    types: [update-manifest-api]

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ptcc-production
      
      - name: Determine image tag
        id: image_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "image=${{ github.event.inputs.docker_image }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.image_tag }}" >> $GITHUB_OUTPUT
            echo "image=${{ github.event.client_payload.docker_image }}" >> $GITHUB_OUTPUT
          else
            # Fallback: usar timestamp
            TAG="ptcc-development-$(date +%Y%m%d%H%M%S)"
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "image=prontdentalsoftware/prontclinic-api" >> $GITHUB_OUTPUT
          fi
          
          echo "📦 Imagem: $(cat $GITHUB_OUTPUT | grep '^image=' | cut -d'=' -f2)"
          echo "🏷️  Tag: $(cat $GITHUB_OUTPUT | grep '^tag=' | cut -d'=' -f2)"
      
      - name: Update Kubernetes Deployment
        run: |
          IMAGE_TAG="${{ steps.image_tag.outputs.tag }}"
          IMAGE_NAME="${{ steps.image_tag.outputs.image }}"
          FULL_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
          
          echo "Atualizando manifest com imagem: ${FULL_IMAGE}"
          
          # Atualizar a imagem no deployment
          sed -i "s|image: prontdentalsoftware/prontclinic-api:.*|image: ${FULL_IMAGE}|g" \
            k8s-manifests/development/prontclinic-api/prontclinic-api-deployment.yaml
          
          echo "✅ Manifest atualizado: ${FULL_IMAGE}"
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Commit and Push
        run: |
          IMAGE_TAG="${{ steps.image_tag.outputs.tag }}"
          
          git add k8s-manifests/development/prontclinic-api/prontclinic-api-deployment.yaml
          
          if git diff --staged --quiet; then
            echo "Nenhuma mudança para commitar"
          else
            git commit -m "chore: atualizar prontclinic-api para ${IMAGE_TAG}

            - Atualizada imagem para prontdentalsoftware/prontclinic-api:${IMAGE_TAG}
            - Auto-atualizado via GitHub Actions workflow"
            
            git push origin ptcc-production
            echo "✅ Commit realizado com sucesso"
          fi

