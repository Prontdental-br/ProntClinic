name: Update Kubernetes Manifest - App

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag da imagem (ex: ptcc-development-20251030195523)'
        required: true
      docker_image:
        description: 'Nome completo da imagem Docker'
        required: false
        default: 'prontdentalsoftware/prontclinic-app'
  repository_dispatch:
    types: [update-manifest-app]

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Notificar início da atualização no Discord
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "📝 Manifest Update Iniciado - prontclinic-app",
                "description": "Atualizando manifest Kubernetes do **prontclinic-app**",
                "color": 3447003,
                "fields": [
                  {
                    "name": "📦 Repositório",
                    "value": "'"$GITHUB_REPOSITORY"'",
                    "inline": true
                  },
                  {
                    "name": "🌿 Branch",
                    "value": "ptcc-production",
                    "inline": true
                  },
                  {
                    "name": "🔔 Tipo",
                    "value": "'"$GITHUB_EVENT_NAME"'",
                    "inline": true
                  }
                ],
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
              }]
            }' \
            "https://discord.com/api/webhooks/1434616055807873127/roVY8wNVy4Ay2uKrBydVVHlxXVDfKOto-TvWexKhz8yp_NI1eiSCBl1ti6WnB7IT5wHo"
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ptcc-production
      
      - name: Determine image tag
        id: image_tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "image=${{ github.event.inputs.docker_image }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.image_tag }}" >> $GITHUB_OUTPUT
            echo "image=${{ github.event.client_payload.docker_image }}" >> $GITHUB_OUTPUT
          else
            TAG="ptcc-development-$(date +%Y%m%d%H%M%S)"
            echo "tag=${TAG}" >> $GITHUB_OUTPUT
            echo "image=prontdentalsoftware/prontclinic-app" >> $GITHUB_OUTPUT
          fi
          
          echo "📦 Imagem: $(cat $GITHUB_OUTPUT | grep '^image=' | cut -d'=' -f2)"
          echo "🏷️  Tag: $(cat $GITHUB_OUTPUT | grep '^tag=' | cut -d'=' -f2)"
      
      - name: Update Kubernetes Deployment
        run: |
          IMAGE_TAG="${{ steps.image_tag.outputs.tag }}"
          IMAGE_NAME="${{ steps.image_tag.outputs.image }}"
          FULL_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
          
          echo "Atualizando manifest com imagem: ${FULL_IMAGE}"
          
          # Atualizar a imagem no deployment
          sed -i "s|image: prontdentalsoftware/prontclinic-app:.*|image: ${FULL_IMAGE}|g" \
            k8s-manifests/development/prontclinic-app/prontclinic-app-deployment.yaml
          
          echo "✅ Manifest atualizado: ${FULL_IMAGE}"
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Commit and Push
        run: |
          IMAGE_TAG="${{ steps.image_tag.outputs.tag }}"
          
          git add k8s-manifests/development/prontclinic-app/prontclinic-app-deployment.yaml
          
          if git diff --staged --quiet; then
            echo "Nenhuma mudança para commitar"
          else
            git commit -m "chore: atualizar prontclinic-app para ${IMAGE_TAG}

            - Atualizada imagem para prontdentalsoftware/prontclinic-app:${IMAGE_TAG}
            - Auto-atualizado via GitHub Actions workflow"
            
            git push origin ptcc-production
            echo "✅ Commit realizado com sucesso"
          fi
      
      - name: Notificar sucesso no Discord
        run: |
          IMAGE_TAG="${{ steps.image_tag.outputs.tag }}"
          IMAGE_NAME="${{ steps.image_tag.outputs.image }}"
          FULL_IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
          
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "✅ Manifest Atualizado com Sucesso - prontclinic-app",
                "description": "Manifest Kubernetes atualizado e commitado no Infra-Clinic!",
                "color": 5763719,
                "fields": [
                  {
                    "name": "📦 Nova Imagem",
                    "value": "`'"$FULL_IMAGE"'`",
                    "inline": false
                  },
                  {
                    "name": "📂 Manifest",
                    "value": "k8s-manifests/development/prontclinic-app/",
                    "inline": true
                  },
                  {
                    "name": "🌿 Branch",
                    "value": "ptcc-production",
                    "inline": true
                  },
                  {
                    "name": "🚀 Próximo Passo",
                    "value": "ArgoCD detectará a mudança e fará o deploy automaticamente",
                    "inline": false
                  }
                ],
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
              }]
            }' \
            "https://discord.com/api/webhooks/1434616055807873127/roVY8wNVy4Ay2uKrBydVVHlxXVDfKOto-TvWexKhz8yp_NI1eiSCBl1ti6WnB7IT5wHo"
      
      - name: Notificar falha no Discord
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ Falha ao Atualizar Manifest - prontclinic-app",
                "description": "Erro ao atualizar manifest Kubernetes no Infra-Clinic",
                "color": 15158332,
                "fields": [
                  {
                    "name": "📦 Repositório",
                    "value": "'"$GITHUB_REPOSITORY"'",
                    "inline": true
                  },
                  {
                    "name": "🌿 Branch",
                    "value": "ptcc-production",
                    "inline": true
                  },
                  {
                    "name": "🔗 Logs",
                    "value": "[Ver workflow](https://github.com/'"$GITHUB_REPOSITORY"'/actions/runs/'"$GITHUB_RUN_ID"')",
                    "inline": false
                  }
                ],
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
              }]
            }' \
            "https://discord.com/api/webhooks/1434616055807873127/roVY8wNVy4Ay2uKrBydVVHlxXVDfKOto-TvWexKhz8yp_NI1eiSCBl1ti6WnB7IT5wHo"

