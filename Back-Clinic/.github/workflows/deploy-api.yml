name: Build and Push Docker Image

on:
  push:
    branches:
      - ptcc-development
      
  workflow_dispatch:

jobs:
  build_and_push:
    concurrency:
      group: build-api-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Checkout do código do repositório
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Define variáveis de ambiente com base na branch
      - name: Definir variáveis com base na branch
        id: vars
        run: |
          BRANCH="${GITHUB_REF##*/}"
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          
          # Tag única baseada no timestamp (formato: branch-timestamp)
          TAG_ONLY="${BRANCH}-${TIMESTAMP}"
          # Tag única baseada no timestamp
          IMAGE_TAG="prontdentalsoftware/prontclinic-api:${BRANCH}-${TIMESTAMP}"
          # Tag estável por branch para consumo pelo Argo CD Image Updater
          STABLE_TAG="prontdentalsoftware/prontclinic-api:${BRANCH}"

          # Define variáveis globais
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "STABLE_TAG=$STABLE_TAG" >> $GITHUB_ENV
          echo "TAG_ONLY=$TAG_ONLY" >> $GITHUB_ENV
          
          # Output para uso posterior
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "stable_tag=$STABLE_TAG" >> $GITHUB_OUTPUT
          echo "tag_only=$TAG_ONLY" >> $GITHUB_OUTPUT

      # Valida variáveis necessárias
      - name: Validar variáveis necessárias
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "⚠️ DOCKER_USERNAME não configurado"
            exit 1
          fi
          if [ -z "$DOCKER_TOKEN" ]; then
            echo "⚠️ DOCKER_TOKEN não configurado"
            exit 1
          fi

          echo "✅ Todas as variáveis necessárias estão configuradas"

      # Autentica no Docker Hub
      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # Configura QEMU para ARM64
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Configura Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build e Push da imagem Docker (APENAS ARM64) 
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile
          push: true
          platforms: linux/arm64  # 🎯 APENAS ARM64
          tags: |
            ${{ env.IMAGE_TAG }}
            ${{ env.STABLE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Disparar atualização do manifest no Infra-Clinic
      - name: Trigger manifest update
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GH_PAT }}
          repository: Prontdental-br/Infra-Clinic
          event-type: update-manifest-api
          client-payload: |
            {
              "image_tag": "${{ env.TAG_ONLY }}",
              "docker_image": "prontdentalsoftware/prontclinic-api"
            }
        timeout-minutes: 20

      # (Sem edição de manifesto; build-only)

      # Notifica sucesso
      - name: Notificar sucesso
        run: |
          echo "✅ Imagem Docker construída e enviada com sucesso!"
          echo "📦 Imagem criada:"
          echo "  - $IMAGE_TAG"
          echo "  - $STABLE_TAG (rastreadas pelo Argo CD Image Updater)"
          echo "🏗️ Plataforma: linux/arm64"
          echo "🌿 Branch: $GITHUB_REF_NAME"
          echo "📝 Commit: $GITHUB_SHA"

      # Notifica falha (opcional)
      - name: Notificar falha
        if: failure()
        run: |
          echo "❌ Build falhou!"
          echo "🌿 Branch: $GITHUB_REF_NAME"
          echo "📝 Commit: $GITHUB_SHA"