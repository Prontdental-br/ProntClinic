name: Build and Push Docker Image - App

on:
  push:
    branches:
      - ptcc-development
      
  workflow_dispatch:

jobs:
  build_and_push:
    concurrency:
      group: build-app-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Notifica início do deploy
      - name: Notificar início do deploy no Discord
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "🚀 Deploy Iniciado - Front-Clinic App",
                "description": "Iniciando build da imagem Docker do **prontclinic-app**",
                "color": 3447003,
                "fields": [
                  {
                    "name": "📦 Repositório",
                    "value": "'"$GITHUB_REPOSITORY"'",
                    "inline": true
                  },
                  {
                    "name": "🌿 Branch",
                    "value": "'"$GITHUB_REF_NAME"'",
                    "inline": true
                  },
                  {
                    "name": "👤 Autor",
                    "value": "'"$GITHUB_ACTOR"'",
                    "inline": true
                  },
                  {
                    "name": "📝 Commit",
                    "value": "[`'"${GITHUB_SHA:0:7}"'`](https://github.com/'"$GITHUB_REPOSITORY"'/commit/'"$GITHUB_SHA"')",
                    "inline": false
                  }
                ],
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
              }]
            }' \
            "https://discord.com/api/webhooks/1434616055807873127/roVY8wNVy4Ay2uKrBydVVHlxXVDfKOto-TvWexKhz8yp_NI1eiSCBl1ti6WnB7IT5wHo"
      
      # Checkout do código do repositório
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Define variáveis de ambiente com base na branch
      - name: Definir variáveis com base na branch
        id: vars
        run: |
          BRANCH="${GITHUB_REF##*/}"
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          
          # Tag única baseada no timestamp (formato: branch-timestamp)
          TAG_ONLY="${BRANCH}-${TIMESTAMP}"
          # Tag única baseada no timestamp
          IMAGE_TAG="prontdentalsoftware/prontclinic-app:${BRANCH}-${TIMESTAMP}"
          # Tag estável por branch para consumo pelo Argo CD Image Updater
          STABLE_TAG="prontdentalsoftware/prontclinic-app:${BRANCH}"

          # Define variáveis globais
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "STABLE_TAG=$STABLE_TAG" >> $GITHUB_ENV
          echo "TAG_ONLY=$TAG_ONLY" >> $GITHUB_ENV
          
          # Output para uso posterior
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "stable_tag=$STABLE_TAG" >> $GITHUB_OUTPUT
          echo "tag_only=$TAG_ONLY" >> $GITHUB_OUTPUT

      # Valida variáveis necessárias
      - name: Validar variáveis necessárias
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "⚠️ DOCKER_USERNAME não configurado"
            exit 1
          fi
          if [ -z "$DOCKER_TOKEN" ]; then
            echo "⚠️ DOCKER_TOKEN não configurado"
            exit 1
          fi

          echo "✅ Todas as variáveis necessárias estão configuradas"

      # Autentica no Docker Hub
      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      # Configura QEMU para ARM64
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Configura Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build e Push da imagem Docker (APENAS ARM64) 
      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          file: ./Dockerfile
          push: true
          platforms: linux/arm64  # 🎯 APENAS ARM64
          tags: |
            ${{ env.IMAGE_TAG }}
            ${{ env.STABLE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Disparar atualização do manifest no Infra-Clinic
      - name: Trigger manifest update
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GH_PAT }}
          repository: Prontdental-br/Infra-Clinic
          event-type: update-manifest-app
          client-payload: |
            {
              "image_tag": "${{ env.TAG_ONLY }}",
              "docker_image": "prontdentalsoftware/prontclinic-app"
            }
        timeout-minutes: 20

      # Notifica sucesso
      - name: Notificar sucesso no Discord
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "✅ Deploy Concluído com Sucesso - Front-Clinic App",
                "description": "Imagem Docker construída, enviada e manifest atualizado com sucesso!",
                "color": 5763719,
                "fields": [
                  {
                    "name": "📦 Imagem",
                    "value": "`'"$IMAGE_TAG"'`",
                    "inline": false
                  },
                  {
                    "name": "🏗️ Plataforma",
                    "value": "linux/arm64",
                    "inline": true
                  },
                  {
                    "name": "🌿 Branch",
                    "value": "'"$GITHUB_REF_NAME"'",
                    "inline": true
                  },
                  {
                    "name": "👤 Autor",
                    "value": "'"$GITHUB_ACTOR"'",
                    "inline": true
                  },
                  {
                    "name": "📝 Commit",
                    "value": "[`'"${GITHUB_SHA:0:7}"'`](https://github.com/'"$GITHUB_REPOSITORY"'/commit/'"$GITHUB_SHA"')",
                    "inline": false
                  },
                  {
                    "name": "🚀 Próximo Passo",
                    "value": "ArgoCD irá detectar e aplicar a mudança automaticamente",
                    "inline": false
                  }
                ],
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
              }]
            }' \
            "https://discord.com/api/webhooks/1434616055807873127/roVY8wNVy4Ay2uKrBydVVHlxXVDfKOto-TvWexKhz8yp_NI1eiSCBl1ti6WnB7IT5wHo"

      # Notifica falha
      - name: Notificar falha no Discord
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ Deploy Falhou - Front-Clinic App",
                "description": "Erro durante o build ou push da imagem Docker",
                "color": 15158332,
                "fields": [
                  {
                    "name": "📦 Repositório",
                    "value": "'"$GITHUB_REPOSITORY"'",
                    "inline": true
                  },
                  {
                    "name": "🌿 Branch",
                    "value": "'"$GITHUB_REF_NAME"'",
                    "inline": true
                  },
                  {
                    "name": "👤 Autor",
                    "value": "'"$GITHUB_ACTOR"'",
                    "inline": true
                  },
                  {
                    "name": "📝 Commit",
                    "value": "[`'"${GITHUB_SHA:0:7}"'`](https://github.com/'"$GITHUB_REPOSITORY"'/commit/'"$GITHUB_SHA"')",
                    "inline": false
                  },
                  {
                    "name": "🔗 Logs",
                    "value": "[Ver workflow](https://github.com/'"$GITHUB_REPOSITORY"'/actions/runs/'"$GITHUB_RUN_ID"')",
                    "inline": false
                  }
                ],
                "timestamp": "'"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"'"
              }]
            }' \
            "https://discord.com/api/webhooks/1434616055807873127/roVY8wNVy4Ay2uKrBydVVHlxXVDfKOto-TvWexKhz8yp_NI1eiSCBl1ti6WnB7IT5wHo"

